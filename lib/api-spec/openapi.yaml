        id: { type: integer }
        provider:
          type: string
          enum: [does_the_dog_die, wikidata]
        status:
          type: string
          enum: [running, interrupted, completed, failed]
        limit: { type: integer }
        offset: { type: integer }
        processed: { type: integer }
        mapped: { type: integer }
        missing: { type: integer }
        errors: { type: integer }
        nextOffset: { type: integer }
        catalogFingerprint: { type: ["string", "null"] }
        results:
          type: array
          items:
            $ref: "#/components/schemas/AdminContentRefreshResult"
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        error: { type: ["string", "null"] }
    AdminContentRefreshBatchHistoryEntry:
      type: object
      required: [id, provider, status, limit, offset, processed, mapped, missing, errors, nextOffset, completedAt]
