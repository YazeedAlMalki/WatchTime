openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WatchTime API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: diagnostics
  - name: catalog
  - name: tracking
  - name: safety
  - name: stats
  - name: feedback
  - name: admin
  - name: imports
  - name: auth
paths:
  /diagnostics/startup:
    post:
      operationId: reportStartupDiagnostic
      tags: [diagnostics]
      summary: Record a non-sensitive mobile startup failure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event]
              properties:
                event:
                  type: string
                  enum: [font-error, splash-hide-error, splash-prevent-error]
      responses:
        "204": { description: Diagnostic recorded }
        "400": { description: Invalid diagnostic }
        "429": { description: Too many diagnostics }
  /dev-auth/login:
    post:
      operationId: devAuthLogin
      tags: [auth]
      summary: Development-only demo login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Short-lived demo session (also sets a HttpOnly cookie)
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresIn, userId]
                properties:
                  token: { type: string }
                  expiresIn: { type: integer }
                  userId: { type: string }
        "401": { description: Invalid credentials }
        "404": { description: Unavailable outside development }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [tracking]
      summary: Current user profile and eligibility
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
    patch:
      operationId: updateMe
      tags: [tracking]
      summary: Update current user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          description: Invalid preference
        "401":
          description: Not authenticated
  /titles:
    get:
      operationId: listTitles
      tags: [catalog]
      summary: Browse titles with filters
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [movie, tv, anime, documentary] }
        - name: genre
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, newest, name] }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Title"
  /titles/trending:
    get:
      operationId: getTrendingTitles
      tags: [catalog]
      summary: Trending titles by content type
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [movie, tv, anime, documentary] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Trending titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Title"
  /titles/{id}:
    get:
      operationId: getTitle
      tags: [catalog]
      summary: Title detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Title detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          description: Not found
  /titles/{id}/seasons/{seasonNumber}:
    get:
      operationId: getSeason
      tags: [catalog]
      summary: Season with episodes (includes watched flags when authenticated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: seasonNumber
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Season detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonDetail"
        "404":
          description: Not found
  /titles/{id}/similar:
    get:
      operationId: getSimilarTitles
      tags: [catalog]
      summary: Similar titles
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Similar titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Title"
  /safety:
    get:
      operationId: getTitleSafety
      tags: [safety]
      summary: Content safety info with episode/season/series fallback
      parameters:
        - name: titleId
          in: query
          required: true
          schema: { type: integer }
        - name: seasonNumber
          in: query
          schema: { type: integer }
        - name: episodeNumber
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Safety info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyInfo"
  /titles/{id}/safety/contributions:
    post:
      operationId: createSafetyContribution
      tags: [safety]
      summary: Submit a community safety contribution (requires eligibility)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyContributionInput"
      responses:
        "201":
          description: Created (pending review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyContribution"
        "401":
          description: Not authenticated
        "403":
          description: Not eligible
  /titles/{id}/safety/reports:
    post:
      operationId: createSafetyReport
      tags: [safety]
      summary: Report incorrect safety data
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyReport"
        "401":
          description: Not authenticated
  /titles/{id}/watchlist:
    post:
      operationId: addToWatchlist
      tags: [tracking]
      summary: Add title to watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Not authenticated
    delete:
      operationId: removeFromWatchlist
      tags: [tracking]
      summary: Remove title from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Not authenticated
  /titles/{id}/watched:
    post:
      operationId: markTitleWatched
      tags: [tracking]
      summary: Mark a movie watched (or follow a show)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Not authenticated
    delete:
      operationId: unmarkTitleWatched
      tags: [tracking]
      summary: Unmark a movie watched (or unfollow a show)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unmarked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Not authenticated
  /episodes/{episodeId}/watched:
    post:
      operationId: markEpisodeWatched
      tags: [tracking]
      summary: Mark an episode watched (optionally all previous episodes too)
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeWatchInput"
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Not authenticated
    delete:
      operationId: unmarkEpisodeWatched
      tags: [tracking]
      summary: Unmark an episode watched
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unmarked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Not authenticated
  /me/shows:
    get:
      operationId: getMyShows
      tags: [tracking]
      summary: Tracked shows with progress and next episode to watch
      description: Ordered by descending, immutable title ID. Pass the last title ID as beforeId for the next page. Progress or membership changes cannot shift the page boundary; newly added titles above it appear on refresh.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
        - name: beforeId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Tracked shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackedShow"
        "401":
          description: Not authenticated
  /me/shows/in-progress:
    get:
      operationId: getMyInProgressShows
      tags: [tracking]
      summary: Tracked shows with watched episodes and episodes remaining
      description: Ordered by descending immutable title ID, independently of the full shows collection. Pass the last title ID as beforeId for the next page. Changes in progress can change membership but never the ID boundary; refresh from the first page to see newly eligible titles.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
        - name: beforeId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: In-progress shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackedShow"
        "400":
          description: Invalid pagination
        "401":
          description: Not authenticated
  /me/movies:
    get:
      operationId: getMyMovies
      tags: [tracking]
      summary: Tracked (watched) movies
      description: Ordered by watchedAt descending, then watch-entry ID descending. Pass the last item's collectionCursor as before for the next page. Removed items do not shift the boundary; new items above it appear on refresh.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
        - name: before
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Watched movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Title"
        "401":
          description: Not authenticated
  /me/watchlist:
    get:
      operationId: getMyWatchlist
      tags: [tracking]
      summary: Watchlist titles
      description: Ordered by saved-at descending, then watchlist-entry ID descending. Pass the last item's collectionCursor as before for the next page. Removed items do not shift the boundary; new items above it appear on refresh.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
        - name: before
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Title"
        "401":
          description: Not authenticated
  /me/recent:
    get:
      operationId: getMyRecentActivity
      tags: [tracking]
      summary: Recently watched episodes and movies
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentActivityItem"
        "401":
          description: Not authenticated
  /me/recommendations:
    get:
      operationId: getMyRecommendations
      tags: [tracking]
      summary: Simple recommendations (because you watched X)
      responses:
        "200":
          description: Recommendation groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendationGroup"
        "401":
          description: Not authenticated
  /imports:
    post:
      operationId: createImport
      tags: [imports]
      summary: Parse a bounded watch-history export into a private preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCreateInput"
      responses:
        "200":
          description: Existing idempotent import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "201":
          description: Parsed import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400": { description: "Malformed, unsupported, or oversized input" }
        "413": { description: "JSON transport body exceeds the endpoint parser limit" }
        "401": { description: Not authenticated }
        "429": { description: Rate limited }
  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get a private import preview or completed result
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "401": { description: Not authenticated }
        "404": { description: Import not found }
  /imports/{id}/items/{itemId}:
    patch:
      operationId: resolveImportItem
      tags: [imports]
      summary: Resolve an offered ambiguous title candidate or skip an item
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportItemResolution"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportItem"
        "400": { description: Invalid resolution or completed import }
        "401": { description: Not authenticated }
        "404": { description: Import or item not found }
  /imports/{id}/confirm:
    post:
      operationId: confirmImport
      tags: [imports]
      summary: Atomically apply selected matched import items
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Completed import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "401": { description: Not authenticated }
        "404": { description: Import not found }
        "429": { description: Rate limited }
  /imports/{id}/report:
    get:
      operationId: downloadImportReport
      tags: [imports]
      summary: Download private unmatched/error import rows as CSV
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Error and unmatched item report
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Not authenticated }
        "404": { description: Import not found }
  /stats/public:
    get:
      operationId: getPublicStats
      tags: [stats]
      summary: Public aggregate statistics
      responses:
        "200":
          description: Public stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"
  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit bug report, feature suggestion, or general feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "403":
          description: Forbidden
        "500":
          description: Safety batch refresh failed
  /admin/contributions:
    get:
      operationId: listAdminContributions
      tags: [admin]
      summary: List community contributions by status
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, flagged] }
      responses:
        "200":
          description: Contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyContribution"
        "403":
          description: Forbidden
  /admin/contributions/{contributionId}:
    patch:
      operationId: updateAdminContribution
      tags: [admin]
      summary: Approve/reject/flag a contribution
      parameters:
        - name: contributionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionModeration"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyContribution"
        "403":
          description: Forbidden
  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: List safety issue reports
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed] }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyReport"
        "403":
          description: Forbidden
  /admin/reports/{reportId}:
    patch:
      operationId: updateAdminReport
      tags: [admin]
      summary: Resolve or dismiss a report
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportModeration"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyReport"
        "403":
          description: Forbidden
  /admin/feedback:
    get:
      operationId: listAdminFeedback
      tags: [admin]
      summary: List user feedback
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [new, reviewing, resolved, closed] }
        - name: category
          in: query
          schema: { type: string, enum: [bug, feature, general] }
      responses:
        "200":
          description: Feedback items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackItem"
        "403":
          description: Forbidden
  /admin/feedback/{feedbackId}:
    patch:
      operationId: updateAdminFeedback
      tags: [admin]
      summary: Update feedback status
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackModeration"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackItem"
        "403":
          description: Forbidden
  /admin/integrations:
    get:
      operationId: listAdminIntegrations
      tags: [admin]
      summary: Provider integration health
      responses:
        "200":
          description: Integration health rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationHealth"
        "403":
          description: Forbidden
  /admin/catalog-refreshes:
    get:
      operationId: listCatalogRefreshes
      tags: [admin]
      summary: Recent catalog refresh runs and failures
      responses:
        "200":
          description: Recent refresh runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogRefreshRun"
        "403":
          description: Forbidden
    post:
      operationId: startCatalogRefresh
      tags: [admin]
      summary: Start a full catalog refresh
      responses:
        "202":
          description: Refresh accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRefreshAccepted"
        "403":
          description: Forbidden
  /admin/catalog-refreshes/{id}/retry:
    post:
      operationId: retryCatalogRefresh
      tags: [admin]
      summary: Retry failed titles from a catalog refresh
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRefreshAccepted"
        "409":
          description: No failed titles
        "403":
          description: Forbidden
  /admin/content:
    get:
      operationId: searchAdminContent
      tags: [admin]
      summary: Search content items with provider mappings
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: region
          in: query
          description: Rating region used to select the official Wikidata record
          schema:
            allOf:
              - $ref: "#/components/schemas/RatingRegion"
            default: US
        - name: malformedRefreshTimestamp
          in: query
          description: Return only titles whose selected regional rating has a malformed refresh timestamp
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Content mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentMapping"
        "403":
          description: Forbidden
  /admin/content-aliases:
    get:
      operationId: listAdminContentAliases
      tags: [admin]
      summary: Review alternate-title provenance and collisions
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: ownership
          in: query
          description: Filter aliases by their source ownership
          schema: { type: string, enum: [provider, editorial] }
        - name: id
          in: query
          description: Find one alias by record ID regardless of search or ownership filters
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          description: Maximum number of aliases to return
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          description: Number of matching aliases to skip
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Page of alternate titles with provenance and total matching count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentAliasPage"
        "403":
          description: Forbidden
  /admin/content-aliases/{id}:
    patch:
      operationId: updateAdminContentAlias
      tags: [admin]
      summary: Correct an alternate title without changing catalog identity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContentAliasUpdate"
      responses:
        "200":
          description: Updated alternate title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentAliasRecord"
        "400":
          description: Invalid alias
        "404":
          description: Alias not found
        "409":
          description: Duplicate, canonical-title, or stale-version conflict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminContentAliasConflict"
                  - type: object
                    required: [error]
                    properties:
                      error: { type: string }
        "403":
          description: Forbidden
    delete:
      operationId: deleteAdminContentAlias
      tags: [admin]
      summary: Remove an alternate title without changing catalog identity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContentAliasDelete"
      responses:
        "204":
          description: Alternate title removed
        "400":
          description: Invalid or missing alias timestamp
        "404":
          description: Alias not found
        "409":
          description: Alias changed since the review page was opened
        "403":
          description: Forbidden
  /admin/content/{id}/refresh:
    post:
      operationId: refreshAdminContent
      tags: [admin]
      summary: Force refresh safety data for a content item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContentRefreshInput"
      responses:
        "200":
          description: Refresh queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentRefreshResult"
        "403":
          description: Forbidden
  /admin/content/refresh-batch:
    get:
      operationId: getAdminContentRefreshBatch
      tags: [admin]
      summary: Get the latest admin safety batch refresh status
      responses:
        "200":
          description: Latest completed batch, active batch, and most recent interrupted batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentRefreshBatchStatus"
        "403":
          description: Forbidden
    post:
      operationId: refreshAdminContentBatch
      tags: [admin]
      summary: Refresh a bounded batch of catalog safety data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContentRefreshBatchInput"
      responses:
        "200":
          description: Per-title refresh outcomes
          content:
            application/json:
              schema:
                type: object
                required: [ok, batchId, offset, limit, processed, nextOffset, catalogFingerprint, results]
                properties:
                  ok: { type: boolean }
                  batchId: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  processed: { type: integer }
                  nextOffset: { type: integer }
                  catalogFingerprint: { type: string }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminContentRefreshResult"
        "403":
          description: Forbidden
        "409":
          description: Safety batch continuation is unsafe because the catalog changed or the saved offset is invalid
        "500":
          description: Safety batch refresh failed
  /admin/content/refresh-batch/history:
    get:
      operationId: listAdminContentRefreshBatchHistory
      tags: [admin]
      summary: List recent completed and failed safety-sync batches
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A bounded list of recent safety-sync batch summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminContentRefreshBatchHistoryEntry"
        "400":
          description: Invalid history limit
        "403":
          description: Forbidden
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Internal analytics summary
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "403":
          description: Forbidden
  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: Paginated admin audit log
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string, enum: [contribution, report, feedback, content] }
        - name: adminEmail
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "403":
          description: Forbidden
components:
  parameters:
    ImportId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkResult:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    ImportCreateInput:
      type: object
      required: [source, fileName, content]
      properties:
        source:
          type: string
          enum: [tvtime, trakt, letterboxd, generic]
          description: "Selects the strict documented export shape; see docs/import-api-contract.md."
        fileName: { type: string, minLength: 1, maxLength: 255 }
        content:
          type: string
          maxLength: 2097152
          description: Raw UTF-8 CSV or JSON text; never retained after parsing.
    ImportNormalizedRecord:
      type: object
      required: [kind, title, type, year, imdbId, tmdbId, season, episode, watchedAt]
      properties:
        kind: { type: string, enum: [watched_movie, watched_episode, tracked_show, watchlist] }
        title: { type: string }
        type: { type: ["string", "null"], enum: [movie, tv, null] }
        year: { type: ["integer", "null"] }
        imdbId: { type: ["string", "null"] }
        tmdbId: { type: ["integer", "null"] }
        season: { type: ["integer", "null"] }
        episode: { type: ["integer", "null"] }
        watchedAt: { type: ["string", "null"], format: date-time }
    ImportCandidate:
      type: object
      required: [titleId, name, type, year]
      properties:
        titleId: { type: integer }
        name: { type: string }
        type: { type: string }
        year: { type: ["integer", "null"] }
    ImportItem:
      type: object
      required: [id, rowNumber, kind, classification, selected, normalized, candidates, titleId, episodeId]
      properties:
        id: { type: integer }
        rowNumber: { type: integer }
        kind: { type: string, enum: [watched_movie, watched_episode, tracked_show, watchlist, unsupported] }
        classification: { type: string, enum: [matched, duplicate, unmatched, ambiguous, invalid, unsupported] }
        selected: { type: boolean }
        errorCode: { type: ["string", "null"] }
        normalized: { $ref: "#/components/schemas/ImportNormalizedRecord" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/ImportCandidate" }
        titleId: { type: ["integer", "null"] }
        episodeId: { type: ["integer", "null"] }
    ImportJob:
      type: object
      required: [id, source, fileName, status, rowCount, summary, createdAt, confirmedAt, items]
      properties:
        id: { type: integer }
        source: { type: string, enum: [tvtime, trakt, letterboxd, generic] }
        fileName: { type: string }
        status: { type: string, enum: [ready, confirming, confirmed] }
        rowCount: { type: integer }
        summary:
          type: object
          additionalProperties: { type: integer }
          description: "Preview classification counts; completed jobs additionally include selected, applied, duplicates, and skipped."
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: ["string", "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportItem" }
    ImportItemResolution:
      oneOf:
        - type: object
          required: [titleId]
          additionalProperties: false
          properties:
            titleId: { type: integer }
        - type: object
          required: [skip]
          additionalProperties: false
          properties:
            skip: { type: boolean, enum: [true] }
    AdminContentRefreshBatchInput:
      type: object
      properties:
        provider:
          type: string
          enum: [does_the_dog_die, wikidata]
          default: does_the_dog_die
        limit: { type: integer, minimum: 1, maximum: 25, default: 10 }
        offset: { type: integer, minimum: 0, default: 0 }
        catalogFingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
    RatingRegion:
      type: string
      enum: [US, GB, DE, FR, AU, BR]
    UserProfile:
      type: object
      required: [id, email, isAdmin, canContribute, showsTracked, episodesWatched, moviesWatched, preferredRatingRegion]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: ["string", "null"] }
        isAdmin: { type: boolean }
        canContribute: { type: boolean }
        showsTracked: { type: integer }
        episodesWatched: { type: integer }
        moviesWatched: { type: integer }
        timeWatchedMinutes: { type: integer }
        preferredRatingRegion:
          $ref: "#/components/schemas/RatingRegion"
    UserPreferences:
      type: object
      required: [preferredRatingRegion]
      properties:
        preferredRatingRegion:
          $ref: "#/components/schemas/RatingRegion"
    UserPreferencesUpdate:
      type: object
      required: [preferredRatingRegion]
      additionalProperties: false
      properties:
        preferredRatingRegion:
          $ref: "#/components/schemas/RatingRegion"
    Title:
      type: object
      required: [id, type, name, posterUrl, year, genres]
      properties:
        id: { type: integer }
        type: { type: string, enum: [movie, tv, anime, documentary] }
        name: { type: string }
        overview: { type: ["string", "null"] }
        posterUrl: { type: ["string", "null"] }
        backdropUrl: { type: ["string", "null"] }
        year: { type: ["integer", "null"] }
        genres:
