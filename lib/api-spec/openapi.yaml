        ok: { type: boolean }
        titleId: { type: integer }
        titleName: { type: string }
        externalId: { type: ["string", "null"] }
        classifications: { type: integer }
        status: { type: string, enum: [provider_unavailable, missing, error] }
        error: { type: string }
    AdminContentRefreshBatch:
      type: object
