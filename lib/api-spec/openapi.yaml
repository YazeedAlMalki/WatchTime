        id: { type: integer }
        provider:
          type: string
          enum: [does_the_dog_die, wikidata]
        status:
          type: string
          enum: [completed, failed]
        limit: { type: integer }
        offset: { type: integer }
        processed: { type: integer }
        mapped: { type: integer }
        missing: { type: integer }
        errors: { type: integer }
        nextOffset: { type: integer }
        completedAt: { type: ["string", "null"], format: date-time }
        error: { type: ["string", "null"] }
    AdminContentRefreshBatchStatus:
      type: object
      required: [lastCompleted, running, interrupted]
      properties:
        lastCompleted:
          oneOf:
            - $ref: "#/components/schemas/AdminContentRefreshBatch"
            - type: "null"
